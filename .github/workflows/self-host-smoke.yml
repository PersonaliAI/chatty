name: Managed Supabase compose smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/self-host-smoke.yml'

permissions:
  contents: read

concurrency:
  # Keep manual verification separate from push-triggered checks. A manual
  # dispatch should never cancel the smoke run that protects a release push.
  group: managed-compose-smoke-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Create CI-only Compose environment
        shell: bash
        run: |
          cat > .ci-compose.env <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://ci.invalid.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-publishable-key
          NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
          BACKEND_PORT=18000
          FRONTEND_PORT=13000
          EOF
          printf 'DEPLOYMENT_PROFILE=managed_supabase\nSUPABASE_URL=https://ci.invalid.supabase.co\nSUPABASE_SECRET_KEY=ci-secret-key\nFUNCTION_SECRET=ci-function-secret\nBYOK_ENCRYPTION_KEY=kLaaohqu72wbf-6sqsj4_yNq2MYBEREBnQ42qEtwRIk=\nGEMINI_API_KEY=ci-test-key\nPORT=8000\n' > backend/.env
          : > frontend/.env

      - name: Validate managed Supabase Compose contract
        run: |
          docker compose --env-file .ci-compose.env config --quiet
          services=$(docker compose --env-file .ci-compose.env config --services)
          test "$(printf '%s\n' "$services" | sort | tr '\n' ' ')" = 'backend frontend '
          if docker compose --env-file .ci-compose.env config | grep -Eiq 'postgres|redis|seaweedfs|minio'; then
            echo 'Managed Supabase Compose must not start a second database, queue, or object store.' >&2
            exit 1
          fi

      - name: Validate self-hosted LiveKit worker Compose contract
        working-directory: backend/voice-agent
        run: |
          cat > .env <<'EOF'
          LIVEKIT_URL=ws://livekit:7880
          LIVEKIT_WORKER_URL=ws://livekit:7880
          LIVEKIT_API_KEY=ci-livekit-key
          LIVEKIT_API_SECRET=ci-livekit-secret
          SUPABASE_URL=https://ci.invalid.supabase.co
          SUPABASE_SECRET_KEY=ci-secret-key
          GEMINI_API_KEY=ci-test-key
          DOMAIN=voice.example.invalid
          LIVEKIT_HOST=127.0.0.1
          EOF
          docker compose --profile self-hosted config --quiet
          services=$(docker compose --profile self-hosted config --services | sort | tr '\n' ' ')
          test "$services" = 'caddy livekit redis voice-worker '
          # Redis is the only published self-hosted coordination endpoint and
          # must remain loopback-only; the worker and LiveKit use the private
          # media-plane network instead of exposing Redis publicly.
          docker compose --profile self-hosted config | grep -q "127.0.0.1:6379"
          # The worker's local health endpoint must remain present so an
          # unregistered-but-running worker can be restarted automatically.
          docker compose --profile self-hosted config | grep -q "127.0.0.1:8081"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run backend smoke tests
        working-directory: backend
        env:
          BYOK_ENCRYPTION_KEY: kLaaohqu72wbf-6sqsj4_yNq2MYBEREBnQ42qEtwRIk=
        run: python -m pytest tests/test_smoke.py -q
