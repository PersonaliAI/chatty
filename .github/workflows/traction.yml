name: Traction & Community Metrics Tracker

on:
  schedule:
    # Run once daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  track-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch GitHub & Community Metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/track_metrics.py

      - name: Upload Traction Artifact
        uses: actions/upload-artifact@v4
        with:
          name: traction-metrics
          path: docs/assets/traction_history.json
