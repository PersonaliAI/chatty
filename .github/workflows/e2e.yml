name: E2E Smoke Suite

# Runs the golden-path Playwright suite against the real production site
# (chatty.personaliai.com) — this project has no separate staging
# environment. Deliberately NOT wired into the on-push CI: hitting
# production on every commit would slow down the fast feedback loop and
# risk flakiness from a live Gemini call blocking merges. Trigger manually
# after a deploy, or on the weekly schedule below.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Checkout + test run + artifact upload only — none of it needs write access
# to the repo (upload-artifact uses its own storage, not the GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run golden-path suite against production
        run: npm run test:e2e
        env:
          BASE_URL: https://chatty.personaliai.com
          # Set these as repo secrets to also exercise the owner-side
          # (dashboard login) test; it skips cleanly without them.
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
