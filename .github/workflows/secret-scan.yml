name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan source tree with Gitleaks
        uses: docker://zricethezav/gitleaks:latest
        with:
          args: dir --redact --exit-code 1 --no-banner .
