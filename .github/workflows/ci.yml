name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'plugins/**'
      - 'docker-compose.yml'
      - 'backend/voice-agent/**'
      - 'requirements*.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'plugins/**'
      - 'docker-compose.yml'
      - 'backend/voice-agent/**'
      - 'requirements*.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

# A newer push supersedes an older validation run on the same branch. This
# prevents parallel pushes from consuming runners while still preserving full
# validation for the latest commit.
concurrency:
  group: chatty-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Neither job needs to write to the repo (checkout + test/build only) - the
# default GITHUB_TOKEN grants broad write access unless scoped down.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile check (catches syntax/indentation errors)
        run: python -m compileall -q main.py app plugins

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
- name: Run smoke + unit tests
        run: python -m pytest tests/ -q
        env:
          # Test-only dummy key (not a real secret) - app/core/crypto.py's
          # _fernet() raises RuntimeError without one, which was failing
          # every BYOK/OAuth-token encryption test (test_crypto.py,
          # test_google_integrations.py, test_microsoft_integrations.py -
          # 11 tests) on every single CI run, unrelated to whatever the
          # push actually changed. Any valid Fernet.generate_key() output
          # works here; this one is fixed only so CI is reproducible.
          BYOK_ENCRYPTION_KEY: kLaaohqu72wbf-6sqsj4_yNq2MYBEREBnQ42qEtwRIk=



      # Non-blocking: surfaces known CVEs in dependencies without failing the
      # build outright - a build shouldn't go red over an advisory in a
      # transitive dep with no available fix yet.
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Verify widget design tokens haven't drifted
        run: node scripts/verify-design-snapshot.mjs

      - name: Install deterministic browser test runtime
        # GitHub's hosted Ubuntu image already includes Chromium runtime
        # libraries. Avoid the apt-heavy --with-deps path here: it can stall
        # the push gate while the deterministic suite itself is unchanged.
        run: npx playwright install chromium

      - name: Run deterministic browser checks
        run: npm run test:e2e
        env:
          E2E_MODE: deterministic

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: deterministic-browser-results
          path: frontend/test-results/
          retention-days: 14

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
