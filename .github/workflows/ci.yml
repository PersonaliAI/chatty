name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile check (catches syntax/indentation errors)
        run: python -m compileall -q main.py app plugins

      - name: Run smoke + unit tests
        run: python -m pytest tests/ -q

      # Non-blocking: surfaces known CVEs in dependencies without failing the
      # build outright — a build shouldn't go red over an advisory in a
      # transitive dep with no available fix yet.
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Non-blocking for now: the existing codebase has ~900 pre-existing lint
      # errors (13k+ incl. warnings) that predate this check being wired in —
      # making it a hard gate today would turn every future push red on day
      # one. Surfacing it in CI output without blocking merges until that
      # backlog gets a dedicated cleanup pass.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Verify widget design tokens haven't drifted
        run: node scripts/verify-design-snapshot.mjs

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
