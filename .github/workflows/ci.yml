name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Neither job needs to write to the repo (checkout + test/build only) — the
# default GITHUB_TOKEN grants broad write access unless scoped down.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile check (catches syntax/indentation errors)
        run: python -m compileall -q main.py app plugins

      - name: Run smoke + unit tests
        run: python -m pytest tests/ -q
        env:
          # Test-only dummy key (not a real secret) — app/core/crypto.py's
          # _fernet() raises RuntimeError without one, which was failing
          # every BYOK/OAuth-token encryption test (test_crypto.py,
          # test_google_integrations.py, test_microsoft_integrations.py -
          # 11 tests) on every single CI run, unrelated to whatever the
          # push actually changed. Any valid Fernet.generate_key() output
          # works here; this one is fixed only so CI is reproducible.
          BYOK_ENCRYPTION_KEY: kLaaohqu72wbf-6sqsj4_yNq2MYBEREBnQ42qEtwRIk=

      # Non-blocking: surfaces known CVEs in dependencies without failing the
      # build outright — a build shouldn't go red over an advisory in a
      # transitive dep with no available fix yet.
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Verify widget design tokens haven't drifted
        run: node scripts/verify-design-snapshot.mjs

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
