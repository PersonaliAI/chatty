name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Non-blocking for now: the existing codebase has ~900 pre-existing lint
      # errors (13k+ incl. warnings) that predate this check being wired in —
      # making it a hard gate today would turn every future push red on day
      # one. Surfacing it in CI output without blocking merges until that
      # backlog gets a dedicated cleanup pass.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Verify widget design tokens haven't drifted
        run: node scripts/verify-design-snapshot.mjs

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          NEXT_PUBLIC_BACKEND_URL: https://chatty-api-376030619262.us-central1.run.app
