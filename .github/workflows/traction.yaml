name: Traction & Community Metrics Tracker

on:
  schedule:
    # Run once daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch GitHub & Community Metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          repo = "PersonaliAI/chatty"
          url = f"https://api.github.com/repos/{repo}"
          headers = {"User-Agent": "Chatty-Traction-Tracker"}
          token = os.environ.get("GITHUB_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"

          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
          except Exception as e:
              print(f"Error fetching repo data: {e}")
              data = {}

          stars = data.get("stargazers_count", 0)
          forks = data.get("forks_count", 0)
          open_issues = data.get("open_issues_count", 0)
          watchers = data.get("watchers_count", 0)

          history_file = "docs/assets/traction_history.json"
          os.makedirs("docs/assets", exist_ok=True)
          history = []
          if os.path.exists(history_file):
              try:
                  with open(history_file, "r") as f:
                      history = json.load(f)
              except Exception:
                  history = []

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          entry = {
              "date": today,
              "stars": stars,
              "forks": forks,
              "open_issues": open_issues,
              "watchers": watchers
          }

          # Update or append
          if history and history[-1].get("date") == today:
              history[-1] = entry
          else:
              history.append(entry)

          with open(history_file, "w") as f:
              json.dump(history, f, indent=2)

          print(f"Recorded metrics for {today}: Stars={stars}, Forks={forks}")
          EOF

      - name: Commit & push updated metrics
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/assets/traction_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(metrics): update community traction history [skip ci]" && git push)
