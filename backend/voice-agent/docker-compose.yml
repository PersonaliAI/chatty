name: chatty-voice-worker

# Worker-only deployment for a VPS.
# Supabase remains managed and LiveKit Cloud remains the realtime media layer.
# This file deliberately does not start LiveKit, Redis, Caddy, PostgreSQL, or
# object storage.

services:
  voice-worker:
    build:
      context: ..
      dockerfile: voice-agent/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?Set LIVEKIT_URL to your LiveKit Cloud URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      LIVEKIT_NUM_IDLE_PROCESSES: ${LIVEKIT_NUM_IDLE_PROCESSES:-3}
      LIVEKIT_LOG_LEVEL: ${LIVEKIT_LOG_LEVEL:-INFO}
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      SONIOX_API_KEY: ${SONIOX_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      FISH_API_KEY: ${FISH_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
