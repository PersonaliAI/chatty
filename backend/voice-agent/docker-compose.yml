name: chatty-voice

# The API and Supabase remain managed. This file supports either LiveKit Cloud
# (the default) or a small self-hosted LiveKit media plane on the same VPS.
# Self-hosted mode adds only LiveKit, Redis, and Caddy; it does not recreate
# Postgres, Supabase Auth, Storage, or the Chatty API.

services:
  voice-worker:
    build:
      context: ..
      dockerfile: voice-agent/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # The worker uses the private Docker network in self-hosted mode. In
      # Cloud mode leave LIVEKIT_WORKER_URL empty and it falls back to the
      # public LIVEKIT_URL below.
      LIVEKIT_URL: ${LIVEKIT_WORKER_URL:-${LIVEKIT_URL:?Set LIVEKIT_URL}}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      # Two warm processes leave enough CPU for realtime turn detection and
      # streaming TTS on the recommended 4-vCPU VPS.
      LIVEKIT_NUM_IDLE_PROCESSES: ${LIVEKIT_NUM_IDLE_PROCESSES:-2}
      LIVEKIT_LOG_LEVEL: ${LIVEKIT_LOG_LEVEL:-INFO}
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      SONIOX_API_KEY: ${SONIOX_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      FISH_API_KEY: ${FISH_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    extra_hosts:
      # LiveKit runs in host networking so its 50k-port UDP range is not
      # expanded into thousands of docker-proxy processes. This mapping lets
      # the worker reach the host-networked signaling endpoint privately.
      - "host.docker.internal:host-gateway"

  # Everything below is opt-in. Start it with:
  #   docker compose --profile self-hosted up -d --build
  livekit:
    profiles: [self-hosted]
    image: ${LIVEKIT_SERVER_IMAGE:-livekit/livekit-server:v1.13.7}
    restart: unless-stopped
    # Host networking is intentional: Docker's port-range publishing creates
    # one proxy process per UDP port (50,000 processes for this range).
    network_mode: host
    # The fallback keeps the Cloud-only profile parseable; setup.sh requires
    # and writes the real public address before self-hosted startup.
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_HOST:-127.0.0.1}"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  redis:
    profiles: [self-hosted]
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    # LiveKit uses host networking; publish Redis only on loopback so it is
    # reachable by LiveKit but never exposed to the public internet.
    ports:
      - "127.0.0.1:6379:6379/tcp"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  caddy:
    profiles: [self-hosted]
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    network_mode: host
    environment:
      # The fallback keeps `docker compose up` (Cloud mode) valid even though
      # Caddy is disabled. setup.sh requires a real DNS name for self-hosting.
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      livekit:
        condition: service_started

volumes:
  redis_data:
  caddy_data:
  caddy_config:
