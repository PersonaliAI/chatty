# ─────────────────────────────────────────────────────────────────────────────
# LiveKit Server Configuration — Self-Hosted (Contabo VPS)
# ─────────────────────────────────────────────────────────────────────────────
# API keys are self-generated (no LiveKit Cloud dependency).
# See setup.sh for key generation.
#
# node_ip is set via CLI flag (--node-ip) in docker-compose.yml
# so it reads from the LIVEKIT_HOST env var at runtime.
# ─────────────────────────────────────────────────────────────────────────────

port: 7880
log_level: info

# Self-generated API key/secret pair.
# Replace with your generated values (see setup.sh or `livekit-server generate-keys`).
# The key is what clients use to mint JWTs; the secret signs them.
keys:
  CHATTY_VOICE_KEY: CHATTY_VOICE_SECRET_REPLACE_ME

rtc:
  # TCP fallback port for clients behind strict UDP-blocking firewalls.
  tcp_port: 7881
  # UDP port range for WebRTC media (audio/video RTP packets).
  # Narrowed to 50000-50200 (200 ports) to avoid Docker iptables overhead.
  # Each active media track uses one port — 200 is plenty for a single-node
  # voice-only deployment (even 50 concurrent calls only need ~100 ports).
  port_range_start: 50000
  port_range_end: 50200
  # Use ICE/UDP as the primary transport (fastest for realtime audio).
  # TCP fallback happens automatically when UDP is blocked.
  use_ice_lite: true

# Embedded TURN server — provides TCP fallback for clients behind
# corporate firewalls that block UDP entirely. No external Coturn needed.
turn:
  enabled: true
  domain: livekit.personaliai.com
  tls_port: 5349
  udp_port: 3478

redis:
  address: redis:6379

# Room defaults
room:
  # Auto-create rooms when the first participant joins.
  auto_create: true
  # Empty room cleanup — destroy rooms with no participants after 60s.
  empty_timeout: 60
  # Max participants per room (voice call = 2: visitor + agent).
  max_participants: 5

# Logging
logging:
  json: true
  level: info
