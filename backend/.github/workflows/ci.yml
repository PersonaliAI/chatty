name: Backend CI

on:
  push:
    branches: [backend-service]
  pull_request:
    branches: [backend-service]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out public mirror
        uses: actions/checkout@v4
        with:
          repository: PersonaliAI/chatty
          ref: main
          path: chatty-public

      - name: Verify changed backend files are mirrored publicly
        run: python scripts/verify-public-mirror.py
        env:
          PUBLIC_MIRROR_DIR: chatty-public

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile check (catches syntax/indentation errors)
        run: python -m compileall -q main.py app plugins

      - name: Run smoke + unit tests
        run: python -m pytest tests/ -q
        env:
          # Test-only dummy key (not a real secret) - app/core/crypto.py's
          # _fernet() raises RuntimeError without one, which was failing
          # every BYOK/OAuth-token encryption test (test_crypto.py,
          # test_google_integrations.py, test_microsoft_integrations.py -
          # 11 tests) on every single CI run, unrelated to whatever the
          # push actually changed. Any valid Fernet.generate_key() output
          # works here; this one is fixed only so CI is reproducible.
          BYOK_ENCRYPTION_KEY: kLaaohqu72wbf-6sqsj4_yNq2MYBEREBnQ42qEtwRIk=

      # Non-blocking: surfaces known CVEs in dependencies without failing the
      # build outright - a build shouldn't go red over an advisory in a
      # transitive dep with no available fix yet. Read the output; a
      # blocking pip-audit gate can be added once there's a first pass to
      # clear the backlog against.
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true
