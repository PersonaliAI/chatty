steps:
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-f', 'Dockerfile.voice-worker',
    '-t', 'us-central1-docker.pkg.dev/personaliai/cloud-run-source-deploy/chatty-voice-worker:latest',
    '.'
  ]
images:
- 'us-central1-docker.pkg.dev/personaliai/cloud-run-source-deploy/chatty-voice-worker:latest'
timeout: '1800s'
options:
  machineType: 'E2_HIGHCPU_8'
