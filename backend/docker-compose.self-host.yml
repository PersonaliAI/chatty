name: chatty-self-host

services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.self-host}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.self-host}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.self-host}
    volumes:
      - chatty-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [chatty-internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chatty-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [chatty-internal]

  seaweedfs:
    image: chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.self-host}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.self-host}
      S3_BUCKET: ${S3_BUCKET:-chatty}
    volumes:
      - chatty-objects:/data
    expose: ["8333", "9333"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [chatty-internal]

  migrate:
    build:
      context: .
    restart: "no"
    env_file: [.env.self-host]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["python", "scripts/self_host_migrate.py"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [chatty-internal]

  api:
    build:
      context: .
    restart: unless-stopped
    env_file: [.env.self-host]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CHATTY_JOB_QUEUE_URL: redis://redis:6379/0
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.self-host}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.self-host}
      S3_BUCKET: ${S3_BUCKET:-chatty}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports: ["${PORT:-8080}:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [chatty-internal]

  webhook-worker:
    build:
      context: .
    restart: unless-stopped
    env_file: [.env.self-host]
    environment:
      REDIS_URL: redis://redis:6379/0
      CHATTY_JOB_QUEUE_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["python", "-m", "app.workers.webhook_worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [chatty-internal]

volumes:
  chatty-postgres:
  chatty-redis:
  chatty-objects:

networks:
  chatty-internal:
    driver: bridge
