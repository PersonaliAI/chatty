services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  # Optional — only needed if you're enabling the real-time voice agent.
  # Comment out (or `docker compose up backend frontend`) to skip it.
  voice-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.voice-worker
    env_file: ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        NEXT_PUBLIC_LEMON_PORTAL_URL: ${NEXT_PUBLIC_LEMON_PORTAL_URL}
    env_file: ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
