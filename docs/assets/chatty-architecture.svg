<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Chatty managed Supabase deployment architecture</title>
  <desc id="desc">Chatty frontend and FastAPI backend run as Docker services on a VPS or container platform while Supabase provides managed authentication, Postgres, storage, realtime, vector search, and row-level security.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="supabase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#34d399"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .section { font: 700 16px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; letter-spacing: 1.5px; }
      .label { font: 700 18px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .small { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 400 12px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .box { stroke: #334155; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .node { fill: #172033; }
      .compute { fill: #312e81; stroke: #818cf8; }
      .api { fill: #064e3b; stroke: #34d399; }
      .external { fill: #1e293b; stroke: #475569; }
      .line { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .greenline { stroke: #34d399; stroke-width: 2.5; fill: none; marker-end: url(#arrowGreen); }
      .dashed { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="40" y="38" width="1520" height="924" rx="24" fill="none" stroke="#1e293b" stroke-width="2"/>

  <image x="78" y="70" width="70" height="70" preserveAspectRatio="xMidYMid meet" xlink:href="../../backend/assets/chatty-icon.png"/>
  <text x="170" y="98" class="title">Chatty architecture</text>
  <text x="170" y="128" class="subtitle">Managed Supabase is the default. Only the application containers move to your host.</text>

  <text x="85" y="190" class="section">CHANNELS</text>
  <rect x="80" y="215" width="220" height="84" class="box node"/>
  <text x="190" y="248" text-anchor="middle" class="label">Website visitors</text>
  <text x="190" y="274" text-anchor="middle" class="small">chat widget / embed</text>

  <rect x="80" y="330" width="220" height="84" class="box node"/>
  <text x="190" y="363" text-anchor="middle" class="label">Bot owners</text>
  <text x="190" y="389" text-anchor="middle" class="small">dashboard / admin</text>

  <rect x="80" y="445" width="220" height="84" class="box node"/>
  <text x="190" y="478" text-anchor="middle" class="label">AI agents</text>
  <text x="190" y="504" text-anchor="middle" class="small">MCP + OAuth 2.0 / PKCE</text>

  <rect x="80" y="560" width="220" height="84" class="box node"/>
  <text x="190" y="593" text-anchor="middle" class="label">Voice callers</text>
  <text x="190" y="619" text-anchor="middle" class="small">WebRTC / LiveKit</text>

  <text x="385" y="190" class="section">YOUR HOST · DOCKER</text>
  <rect x="370" y="215" width="280" height="170" class="box compute"/>
  <text x="510" y="255" text-anchor="middle" class="label">Next.js frontend</text>
  <text x="510" y="282" text-anchor="middle" class="small">dashboard · widget.js · auth UI</text>
  <text x="510" y="317" text-anchor="middle" class="tiny">Dockerfile · port 3000</text>
  <rect x="405" y="338" width="210" height="24" rx="12" fill="#4338ca"/>
  <text x="510" y="355" text-anchor="middle" class="tiny" fill="#e0e7ff">public browser surface</text>

  <rect x="370" y="430" width="280" height="170" class="box api"/>
  <text x="510" y="470" text-anchor="middle" class="label">FastAPI backend</text>
  <text x="510" y="497" text-anchor="middle" class="small">chat · RAG · bookings · channels</text>
  <text x="510" y="524" text-anchor="middle" class="small">MCP server · workers · webhooks</text>
  <text x="510" y="559" text-anchor="middle" class="tiny">Dockerfile · port 8000 · /readyz</text>

  <path d="M300 257 C330 257 340 270 370 270" class="line"/>
  <path d="M300 372 C330 372 340 330 370 330" class="line"/>
  <path d="M300 487 C330 487 340 500 370 500" class="line"/>
  <path d="M300 602 C330 602 340 565 370 565" class="line"/>
  <path d="M510 385 L510 430" class="greenline"/>

  <text x="760" y="190" class="section">MANAGED DATA + IDENTITY</text>
  <rect x="735" y="215" width="330" height="385" class="box" fill="url(#supabase)" stroke="#6ee7b7"/>
  <text x="900" y="265" text-anchor="middle" class="label">Supabase project</text>
  <text x="900" y="292" text-anchor="middle" class="small">one managed source of truth</text>
  <line x1="775" y1="320" x2="1025" y2="320" stroke="#a7f3d0" stroke-opacity=".4"/>
  <text x="900" y="355" text-anchor="middle" class="label">Auth</text>
  <text x="900" y="381" text-anchor="middle" class="label">Postgres + pgvector</text>
  <text x="900" y="407" text-anchor="middle" class="label">Storage</text>
  <text x="900" y="433" text-anchor="middle" class="label">Realtime + RLS</text>
  <text x="900" y="485" text-anchor="middle" class="small">server-only secret key</text>
  <text x="900" y="512" text-anchor="middle" class="small">publishable browser key only</text>
  <text x="900" y="562" text-anchor="middle" class="tiny">no local database or object store in the default profile</text>

  <path d="M650 500 C690 500 700 450 735 450" class="greenline"/>
  <path d="M650 300 C700 300 690 355 735 355" class="greenline"/>

  <text x="1140" y="190" class="section">OPTIONAL SERVICES</text>
  <rect x="1120" y="215" width="190" height="84" class="box external"/>
  <text x="1215" y="248" text-anchor="middle" class="label">Gemini / BYOK</text>
  <text x="1215" y="274" text-anchor="middle" class="small">LLM providers</text>
  <rect x="1340" y="215" width="190" height="84" class="box external"/>
  <text x="1435" y="248" text-anchor="middle" class="label">WhatsApp / Slack</text>
  <text x="1435" y="274" text-anchor="middle" class="small">channels + webhooks</text>
  <rect x="1120" y="330" width="190" height="84" class="box external"/>
  <text x="1215" y="363" text-anchor="middle" class="label">Google / Microsoft</text>
  <text x="1215" y="389" text-anchor="middle" class="small">calendar + mail OAuth</text>
  <rect x="1340" y="330" width="190" height="84" class="box external"/>
  <text x="1435" y="363" text-anchor="middle" class="label">Zoom / LiveKit</text>
  <text x="1435" y="389" text-anchor="middle" class="small">meetings + voice</text>
  <rect x="1120" y="445" width="190" height="84" class="box external"/>
  <text x="1215" y="478" text-anchor="middle" class="label">Lemon Squeezy</text>
  <text x="1215" y="504" text-anchor="middle" class="small">optional billing</text>
  <rect x="1340" y="445" width="190" height="84" class="box external"/>
  <text x="1435" y="478" text-anchor="middle" class="label">Sentry / Resend</text>
  <text x="1435" y="504" text-anchor="middle" class="small">monitoring + email</text>
  <path d="M1065 255 C1090 255 1090 257 1120 257" class="line"/>
  <path d="M1065 285 C1200 285 1210 257 1340 257" class="line"/>
  <path d="M650 540 C870 540 1020 370 1120 370" class="line dashed"/>
  <path d="M650 560 C900 560 1180 370 1340 370" class="line dashed"/>
  <path d="M650 575 C850 575 1020 485 1120 485" class="line dashed"/>

  <rect x="80" y="720" width="1450" height="184" rx="18" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="110" y="758" class="section">DEPLOYMENT TARGETS</text>
  <text x="110" y="790" class="small">Build the same two images anywhere Docker runs. Supabase stays external and unchanged.</text>
  <rect x="110" y="820" width="200" height="52" rx="12" fill="#1e293b" stroke="#64748b"/>
  <text x="210" y="852" text-anchor="middle" class="label">VPS + Compose</text>
  <rect x="350" y="820" width="200" height="52" rx="12" fill="#1e293b" stroke="#64748b"/>
  <text x="450" y="852" text-anchor="middle" class="label">Railway</text>
  <rect x="590" y="820" width="200" height="52" rx="12" fill="#1e293b" stroke="#64748b"/>
  <text x="690" y="852" text-anchor="middle" class="label">Render Blueprint</text>
  <rect x="830" y="820" width="200" height="52" rx="12" fill="#1e293b" stroke="#64748b"/>
  <text x="930" y="852" text-anchor="middle" class="label">Heroku-style PaaS</text>
  <rect x="1070" y="820" width="420" height="52" rx="12" fill="#312e81" stroke="#818cf8"/>
  <text x="1280" y="852" text-anchor="middle" class="label">frontend + backend containers</text>

  <rect x="80" y="925" width="1450" height="22" rx="11" fill="#1e293b"/>
  <text x="805" y="941" text-anchor="middle" class="tiny">Advanced opt-in only: DEPLOYMENT_PROFILE=self_host → PostgreSQL/pgvector + Redis + SeaweedFS + OIDC</text>
</svg>
