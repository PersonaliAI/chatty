<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b3d"/>
      <stop offset="50%" stop-color="#002b66"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="45%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#D4A000"/>
    </linearGradient>

    <!-- Rim Light Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Star Template -->
    <g id="euStar">
      <polygon points="0,-7 2.16,-2.16 7.35,-2.16 3.15,0.88 4.74,5.67 0,2.62 -4.74,5.67 -3.15,0.88 -7.35,-2.16 -2.16,-2.16" fill="url(#goldGrad)" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.4))"/>
    </g>

    <!-- Drop Shadow for Shield -->
    <filter id="shieldShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer Glow / Halo -->
  <circle cx="160" cy="160" r="148" fill="none" stroke="#2563eb" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Main Circular Shield Body -->
  <g filter="url(#shieldShadow)">
    <circle cx="160" cy="160" r="140" fill="url(#shieldBg)"/>
    <!-- Outer Rim -->
    <circle cx="160" cy="160" r="139" fill="none" stroke="url(#rimGrad)" stroke-width="2"/>
    <!-- Gold Inset Ring -->
    <circle cx="160" cy="160" r="132" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.95"/>
    <circle cx="160" cy="160" r="126" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- 12 EU Stars Arranged in a Circle (Radius 108) -->
  <g transform="translate(160, 160)">
    <!-- 12 o'clock -->
    <use href="#euStar" transform="translate(0, -108)"/>
    <!-- 1 o'clock -->
    <use href="#euStar" transform="rotate(30) translate(0, -108)"/>
    <!-- 2 o'clock -->
    <use href="#euStar" transform="rotate(60) translate(0, -108)"/>
    <!-- 3 o'clock -->
    <use href="#euStar" transform="rotate(90) translate(0, -108)"/>
    <!-- 4 o'clock -->
    <use href="#euStar" transform="rotate(120) translate(0, -108)"/>
    <!-- 5 o'clock -->
    <use href="#euStar" transform="rotate(150) translate(0, -108)"/>
    <!-- 6 o'clock -->
    <use href="#euStar" transform="rotate(180) translate(0, -108)"/>
    <!-- 7 o'clock -->
    <use href="#euStar" transform="rotate(210) translate(0, -108)"/>
    <!-- 8 o'clock -->
    <use href="#euStar" transform="rotate(240) translate(0, -108)"/>
    <!-- 9 o'clock -->
    <use href="#euStar" transform="rotate(270) translate(0, -108)"/>
    <!-- 10 o'clock -->
    <use href="#euStar" transform="rotate(300) translate(0, -108)"/>
    <!-- 11 o'clock -->
    <use href="#euStar" transform="rotate(330) translate(0, -108)"/>
  </g>

  <!-- Central Shield Crest -->
  <g transform="translate(160, 112)">
    <!-- Shield Outline -->
    <path d="M 0 -36 C 24 -36 40 -30 40 -12 C 40 22 18 42 0 52 C -18 42 -40 22 -40 -12 C -40 -30 -24 -36 0 -36 Z" fill="#003399" stroke="url(#goldGrad)" stroke-width="2.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))"/>
    
    <!-- Shield Inner Fill -->
    <path d="M 0 -32 C 20 -32 34 -27 34 -11 C 34 18 15 35 0 44 C -15 35 -34 18 -34 -11 C -34 -27 -20 -32 0 -32 Z" fill="#0c234b"/>

    <!-- Security Lock Icon inside Crest -->
    <g transform="translate(0, 2)">
      <!-- Lock Shackle -->
      <path d="M -9 -4 L -9 -12 C -9 -17 9 -17 9 -12 L 9 -4" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
      <!-- Lock Body -->
      <rect x="-14" y="-4" width="28" height="22" rx="4" fill="url(#goldGrad)"/>
      <!-- Keyhole -->
      <circle cx="0" cy="5" r="3" fill="#002244"/>
      <polygon points="-1.5,5 1.5,5 1,12 -1,12" fill="#002244"/>
    </g>
  </g>

  <!-- "GDPR" Main Typography -->
  <text x="160" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="38" letter-spacing="2" fill="#FFFFFF" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.6))">
    GDPR
  </text>

  <!-- "COMPLIANT" Banner Ribbon -->
  <g transform="translate(160, 218)">
    <rect x="-75" y="0" width="150" height="24" rx="12" fill="#10B981" stroke="#059669" stroke-width="1.5" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.3))"/>
    <!-- Checkmark inside banner -->
    <path d="M -56 12 L -50 17 L -40 7" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="4" y="16.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="12.5" letter-spacing="2.5" fill="#FFFFFF">
      COMPLIANT
    </text>
  </g>

  <!-- Legal Regulation Subtitle -->
  <text x="160" y="262" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="9" letter-spacing="1.5" fill="#93C5FD">
    REGULATION (EU) 2016/679
  </text>
  <text x="160" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="8.5" letter-spacing="1" fill="#60A5FA" opacity="0.85">
    DATA PRIVACY GUARANTEED
  </text>
</svg>
