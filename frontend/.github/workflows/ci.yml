name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Checkout + test/build only - doesn't need write access to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check out public mirror
        uses: actions/checkout@v4
        with:
          repository: PersonaliAI/chatty
          ref: main
          path: chatty-public

      - name: Verify changed frontend files are mirrored publicly
        run: npm run test:public-mirror
        env:
          PUBLIC_MIRROR_DIR: chatty-public

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Verify widget design tokens haven't drifted
        run: node scripts/verify-design-snapshot.mjs

      - name: Verify widget preset text/background contrast (WCAG AA)
        run: node scripts/verify-contrast.mjs

      - name: Install browser for deterministic E2E checks
        run: npx playwright install --with-deps chromium

      - name: Run deterministic browser checks
        run: npm run test:e2e
        env:
          E2E_MODE: deterministic

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          NEXT_PUBLIC_BACKEND_URL: https://chatty-api-376030619262.us-central1.run.app
